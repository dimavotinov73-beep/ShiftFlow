<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10182b"><title>ShiftFlow</title>
<style>
:root{--bg:#0d1320;--card:#ffffff12;--line:#ffffff26;--text:#f7f9ff;--muted:#aeb8cb;--accent:#83a2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#26345d,transparent 38%),linear-gradient(135deg,#0d1320,#171d2d);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}body.light{--text:#182033;--muted:#59657d;--card:#ffffffaa;--line:#bcc7df;background:linear-gradient(135deg,#e8edff,#fff)}button,input{font:inherit}button{cursor:pointer;color:var(--text);border:0}.app{max-width:760px;margin:auto;padding:20px 16px 105px}.top,.header,.row{display:flex;align-items:center;justify-content:space-between}.top{margin:8px 0 18px}.brand{font-size:28px;font-weight:800}.brand span{color:var(--accent)}.sub,small{color:var(--muted);font-size:12px}.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);box-shadow:0 12px 40px #0002}.btn{background:#ffffff15;border:1px solid var(--line);padding:10px 14px;border-radius:13px}.primary{background:linear-gradient(135deg,#83a2ff,#70d6ff);color:#081020;font-weight:700}.header{padding:17px;margin-bottom:14px}.header h1{font-size:20px;margin:0;text-transform:capitalize}.calendar{padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:75px;padding:7px;border-radius:14px;background:#ffffff08;border:1px solid transparent;text-align:left;position:relative;color:var(--text)}.day:hover{border-color:#ffffff66}.day.today{outline:2px solid var(--accent)}.empty{visibility:hidden}.work-label{display:block;margin-top:8px;color:var(--accent);font-size:10px;line-height:1.15;white-space:normal;overflow:hidden;max-height:25px}.work-label:before{content:'Работа: ';color:var(--muted)}.dot{position:absolute;left:7px;right:7px;bottom:5px;height:4px;border-radius:8px;background:var(--accent)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.stat{padding:15px 11px}.stat b{display:block;font-size:19px;margin-top:7px}.section{padding:18px;margin-top:14px}.section h2{font-size:18px;margin:0 0 12px}.row{padding:12px 0;border-bottom:1px solid #ffffff14;gap:10px}.row:last-child{border:0}.pill{padding:6px 9px;border-radius:10px;background:#ffffff12;color:var(--muted);font-size:12px}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(728px,calc(100% - 32px));padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;z-index:5}.nav button{background:transparent;padding:10px;border-radius:15px;color:var(--muted)}.nav button.active{background:#83a2ff35;color:var(--text)}.nav span{display:block;font-size:11px;margin-top:3px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(760px,100%);margin:auto;padding:22px;border-radius:27px 27px 0 0;background:#182033;border:1px solid var(--line)}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#ffffff0d;color:var(--text);outline:0}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}@media(max-width:500px){.day{min-height:65px}.stats{gap:5px}.stat b{font-size:15px}}
</style></head>
<body><main class="app"><div class="top"><div><div class="brand">Shift<span>Flow</span></div><div class="sub">Твои смены. Твой доход.</div></div><button class="btn" id="theme">☼</button></div><div id="screen"></div></main><nav class="nav glass"><button data-tab="calendar" class="active">📅<span>Календарь</span></button><button data-tab="finance">💰<span>Финансы</span></button><button data-tab="settings">⚙️<span>Настройки</span></button></nav><div class="modal" id="modal"><div class="sheet"><h2>Добавить работу</h2><label>Название работы</label><input id="work" placeholder="Например: Официант"><label>Доход за смену, ₽</label><input id="income" type="number" min="0" step="1" placeholder="Например: 5000"><div class="actions"><button class="btn" id="close">Отмена</button><button class="btn primary" id="save">Сохранить</button></div></div></div>
<script>
const defaultWorks=['Работа'];let works=JSON.parse(localStorage.shiftflowWorks||'null')||defaultWorks;let shifts=JSON.parse(localStorage.shiftflowShifts||localStorage.shiftflow||'{}');let tab='calendar',selected=new Date();
function key(d){return d.toISOString().slice(0,10)}function money(n){return new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽'}function persist(){localStorage.shiftflowWorks=JSON.stringify(works);localStorage.shiftflowShifts=JSON.stringify(shifts)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='calendar')calendar();if(tab==='finance')finance();if(tab==='settings')settings()}
function calendar(){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),count=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,c='';for(let i=0;i<start;i++)c+='<div class="day empty"></div>';for(let d=1;d<=count;d++){let dt=new Date(y,m,d),k=key(dt),x=shifts[k];c+=`<button class="day ${k===key(new Date())?'today':''}" onclick="openModal('${k}')">${d}${x?`<span class="work-label">${escapeHtml(x.work)}</span><i class="dot"></i>`:''}</button>`}let arr=Object.values(shifts).filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));document.querySelector('#screen').innerHTML=`<div class="header glass"><button class="btn" onclick="move(-1)">‹</button><h1>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h1><button class="btn" onclick="move(1)">›</button></div><div class="calendar glass"><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${c}</div></div><div class="stats"><div class="stat glass"><small>Смен</small><b>${arr.length}</b></div><div class="stat glass"><small>Доход</small><b>${money(arr.reduce((a,x)=>a+x.income,0))}</b></div><div class="stat glass"><small>Работ</small><b>${new Set(arr.map(x=>x.work)).size}</b></div></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function move(n){selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);render()}
function openModal(k){selected=new Date(k+'T12:00:00');let x=shifts[k];document.querySelector('#work').value=x?.work||works[0]||'';document.querySelector('#income').value=x?.income||'';document.querySelector('#modal').classList.add('show')}
function finance(){let all=Object.values(shifts),total=all.reduce((a,x)=>a+x.income,0);document.querySelector('#screen').innerHTML=`<div class="header glass"><h1>Финансы</h1><button class="btn primary" onclick="openModal('${key(new Date())}')">＋ Смена</button></div><div class="stats"><div class="stat glass"><small>Всего смен</small><b>${all.length}</b></div><div class="stat glass"><small>Заработано</small><b>${money(total)}</b></div><div class="stat glass"><small>Работ</small><b>${new Set(all.map(x=>x.work)).size}</b></div></div><div class="section glass"><h2>По работам</h2>${works.map(w=>`<div class="row"><span>${escapeHtml(w)}</span><b>${money(all.filter(x=>x.work===w).reduce((a,x)=>a+x.income,0))}</b></div>`).join('')}</div><div class="section glass"><h2>Последние смены</h2>${all.slice(-8).reverse().map(x=>`<div class="row"><span>${x.date} · ${escapeHtml(x.work)}</span><span class="pill">${money(x.income)}</span></div>`).join('')||'<small>Пока нет смен</small>'}</div>`}
function settings(){document.querySelector('#screen').innerHTML=`<div class="header glass"><h1>Настройки</h1></div><div class="section glass"><h2>Мои работы</h2>${works.map((w,i)=>`<div class="row"><span>${escapeHtml(w)}</span>${works.length>1?`<button class="btn" onclick="removeWork(${i})">Удалить</button>`:''}</div>`).join('')}<div class="actions"><button class="btn primary" onclick="addWork()">＋ Добавить работу</button></div></div><div class="section glass"><h2>Данные</h2><div class="row"><span>Сохранено смен</span><b>${Object.keys(shifts).length}</b></div><button class="btn" onclick="localStorage.clear();location.reload()">Очистить все данные</button></div>`}
function addWork(){let w=prompt('Название новой работы:');if(w&&w.trim()&&!works.includes(w.trim())){works.push(w.trim());persist();render()}}function removeWork(i){if(confirm('Удалить эту работу из списка?')){works.splice(i,1);persist();render()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#save').onclick=()=>{let work=document.querySelector('#work').value.trim(),income=Number(document.querySelector('#income').value);if(!work||income<0)return alert('Введите название работы и сумму дохода');if(!works.includes(work))works.push(work);let k=key(selected);shifts[k]={date:k,work,income};persist();document.querySelector('#modal').classList.remove('show');render()};render();
</script></body></html>
