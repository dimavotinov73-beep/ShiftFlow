<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eef3ff"><title>ShiftFlow</title>
<style>
:root{--bg:#eaf0ff;--bg2:#f9fbff;--text:#14203a;--muted:#69758b;--glass:rgba(255,255,255,.52);--glass-strong:rgba(255,255,255,.72);--line:rgba(255,255,255,.78);--accent:#5d7cff;--shadow:0 20px 55px rgba(76,98,150,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}body{background:radial-gradient(circle at 10% 0,#d8e4ff,transparent 35%),radial-gradient(circle at 100% 90%,#c9f3ff,transparent 32%),linear-gradient(135deg,var(--bg),var(--bg2));background-attachment:fixed;transition:background .5s,color .35s}body.dark{--bg:#0b1224;--bg2:#182542;--text:#f7f9ff;--muted:#aab5c9;--glass:rgba(255,255,255,.11);--glass-strong:rgba(255,255,255,.17);--line:rgba(255,255,255,.23);--shadow:0 20px 55px rgba(0,0,0,.28)}
button,input,select{font:inherit}button{color:var(--text);cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:22px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 0 20px}.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.brand span{color:#54bfe8}.sub{color:var(--muted);font-size:12px}.glass{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.04)),var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:inset 0 1px rgba(255,255,255,.6),var(--shadow);backdrop-filter:blur(30px) saturate(170%);-webkit-backdrop-filter:blur(30px) saturate(170%);animation:appear .45s ease}.glass:before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.28),transparent 30%);pointer-events:none}.glass>*{position:relative}@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.98);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}@keyframes pop{0%{transform:scale(.9);opacity:.4}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.btn{background:rgba(255,255,255,.2);border:1px solid var(--line);border-radius:14px;padding:9px 13px;transition:.25s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px #627cff2b}.primary{background:linear-gradient(135deg,#7391ff,#68d8ed);color:#081329;font-weight:700}.header{padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.header h1{font-size:20px;text-transform:capitalize;margin:0}.calendar{padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:72px;border-radius:16px;background:#ffffff14;border:1px solid transparent;padding:7px;text-align:left;color:var(--text);position:relative;transition:.22s}.day:hover{transform:translateY(-3px);border-color:#ffffffb5}.day.today{outline:2px solid #52cfee;box-shadow:0 0 0 5px #52cfee20;background:#52cfee19}.day.empty{visibility:hidden}.day-item{display:block;margin-top:7px;font-size:10px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.day-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}.stat{text-align:center;padding:18px}.stat small{display:block;color:var(--muted)}.stat b{display:block;font-size:21px;margin-top:7px}.section{padding:17px;margin-top:14px}.section h2{font-size:17px;margin:0 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff24}.row:last-child{border-bottom:0}.nav{position:fixed;z-index:4;bottom:16px;left:50%;transform:translateX(-50%);width:min(728px,calc(100% - 32px));padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{background:transparent;border-radius:17px;padding:10px;color:var(--muted);transition:.25s}.nav button.active{background:#7291ff27;color:var(--text);box-shadow:inset 0 1px #fff5,0 8px 20px #607fff22}.nav span{display:block;font-size:11px;margin-top:3px}.modal{position:fixed;z-index:10;inset:0;background:#06102780;display:none;align-items:flex-end;animation:fade .25s}.modal.show{display:flex}@keyframes fade{from{opacity:0}to{opacity:1}}.sheet{width:min(760px,100%);margin:auto;padding:22px;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;box-shadow:0 -20px 50px #0003;animation:sheet .3s ease}@keyframes sheet{from{transform:translateY(40px)}to{transform:none}}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}input,select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--glass);color:var(--text);outline:0}.actions{display:flex;gap:9px;margin-top:18px}.actions>*{flex:1}.flag-row{display:flex;gap:8px}.flag{font-size:22px;padding:7px 12px;border-radius:12px;background:var(--glass);border:1px solid var(--line)}.flag.active{outline:2px solid var(--accent);background:var(--glass-strong)}.color{width:38px;height:38px;padding:3px;border-radius:12px}.work-card{display:flex;align-items:center;gap:10px}.swatch{width:12px;height:12px;border-radius:50%;display:inline-block}.month-report{display:grid;grid-template-columns:1fr auto;gap:8px 15px}.month-report div{padding:11px 0;border-bottom:1px solid #ffffff25}.chartless-note{color:var(--muted);font-size:12px}@media(max-width:500px){.day{min-height:62px}.stat b{font-size:17px}}
</style></head>
<body><main class="app"><div class="top"><div><div class="brand">Shift<span>Flow</span></div><div class="sub" id="subtitle">Твои смены. Твой доход.</div></div></div><div id="screen"></div></main><nav class="nav glass"><button data-tab="calendar" class="active">📅<span id="n-home">Главная</span></button><button data-tab="finance">💰<span id="n-finance">Финансы</span></button><button data-tab="settings">⚙️<span id="n-settings">Настройки</span></button></nav><div class="modal" id="shiftModal"><div class="sheet"><h2 id="shiftTitle">Смена</h2><label id="workLabel">Наименование работы</label><input id="workInput" placeholder="Например: Официант"><label id="incomeLabel">Доход, ₽</label><input id="incomeInput" type="number" min="0" placeholder="5000"><label id="hoursLabel">Часы</label><input id="hoursInput" type="number" min="0" step="0.5" placeholder="8"><div class="actions"><button class="btn" id="cancelShift">Отмена</button><button class="btn primary" id="saveShift">Сохранить</button></div></div></div><div class="modal" id="agreementModal"><div class="sheet"><h2 id="agreementTitle">Пользовательское соглашение</h2><p id="agreementText" class="chartless-note"></p><button class="btn primary" onclick="closeModal('agreementModal')">OK</button></div></div>
<script>
const tr={ru:{subtitle:'Твои смены. Твой доход.',home:'Главная',finance:'Финансы',settings:'Настройки',shifts:'Смены',income:'Доходы',hours:'Часы',work:'Наименование работы',save:'Сохранить',cancel:'Отмена',today:'Сегодня',reports:'Отчёт по месяцам',language:'Язык',appearance:'Внешний вид',system:'Как в системе',agreement:'Пользовательское соглашение',addWork:'Добавить наименование работы',name:'Название',color:'Цвет',add:'Добавить',empty:'Нет смен',months:'Месяц',theme:'Тема'},en:{subtitle:'Your shifts. Your income.',home:'Home',finance:'Finance',settings:'Settings',shifts:'Shifts',income:'Income',hours:'Hours',work:'Job name',save:'Save',cancel:'Cancel',today:'Today',reports:'Monthly report',language:'Language',appearance:'Appearance',system:'System default',agreement:'User Agreement',addWork:'Add job name',name:'Name',color:'Color',add:'Add',empty:'No shifts',months:'Month',theme:'Theme'}};
let lang=localStorage.sfLang||'ru',theme=localStorage.sfTheme||'system',tab='calendar',selected=new Date(),editingDate=null;let works=JSON.parse(localStorage.sfWorks||'[]');let shifts=JSON.parse(localStorage.sfShifts||'{}');
function T(k){return tr[lang][k]||k}function $(id){return document.getElementById(id)}function localKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function money(n){return new Intl.NumberFormat(lang==='ru'?'ru-RU':'en-US').format(Math.round(n||0))+' ₽'}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function allShifts(){return Object.values(shifts).flat()}function persist(){localStorage.sfShifts=JSON.stringify(shifts);localStorage.sfWorks=JSON.stringify(works)}
function applyTheme(){let dark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark)}function setTheme(v){theme=v;localStorage.sfTheme=v;document.body.classList.add('theme-change');applyTheme();setTimeout(()=>document.body.classList.remove('theme-change'),450);render()}function setLang(v){lang=v;localStorage.sfLang=v;document.documentElement.lang=v;render()}function closeModal(id){$(id).classList.remove('show')}
function render(){applyTheme();$('subtitle').textContent=T('subtitle');$('n-home').textContent=T('home');$('n-finance').textContent=T('finance');$('n-settings').textContent=T('settings');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));tab==='calendar'?calendar():tab==='finance'?finance():settings()}
function calendar(){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,today=localKey(new Date()),cells='';for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=localKey(dt),items=shifts[k]||[];cells+=`<button class="day ${k===today?'today':''}" onclick="openShift('${k}')">${d}${items.map(x=>`<span class="day-item"><i class="day-dot" style="background:${x.color||'#72dfff'}"></i>${esc(x.work)} · ${money(x.income)}</span>`).join('')}</button>`}let a=Object.values(shifts).flat().filter(x=>x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('screen').innerHTML=`<div class="header glass"><button class="btn" onclick="moveMonth(-1)">‹</button><h1>${first.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{month:'long',year:'numeric'})}</h1><button class="btn" onclick="moveMonth(1)">›</button></div><div class="calendar glass"><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div></div><div class="stats"><div class="stat glass"><small>${T('shifts')}</small><b>${a.length}</b></div><div class="stat glass"><small>${T('income')}</small><b>${money(a.reduce((s,x)=>s+x.income,0))}</b></div></div>`}function moveMonth(n){selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);render()}
function openShift(k){editingDate=k;let first=(shifts[k]||[])[0]||{};$('workInput').value=first.work||'';$('incomeInput').value=first.income??'';$('hoursInput').value=first.hours??'';$('shiftModal').classList.add('show');$('shiftTitle').textContent=T('shifts');$('workLabel').textContent=T('work');$('incomeLabel').textContent=T('income')+', ₽';$('hoursLabel').textContent=T('hours');$('cancelShift').textContent=T('cancel');$('saveShift').textContent=T('save')}
$('saveShift').onclick=()=>{let work=$('workInput').value.trim(),income=Number($('incomeInput').value),hours=Number($('hoursInput').value);if(!work||income<0||hours<0)return alert(lang==='ru'?'Заполните все поля':'Fill in all fields');let item={date:editingDate,work,income,hours,color:(works.find(w=>w.name===work)||{}).color||'#72dfff'};if(!works.some(w=>w.name===work)){works.push({name:work,color:item.color})}if(!shifts[editingDate])shifts[editingDate]=[];shifts[editingDate].push(item);persist();closeModal('shiftModal');render()};$('cancelShift').onclick=()=>closeModal('shiftModal');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
function finance(){let a=allShifts(),months={};a.forEach(x=>{let m=x.date.slice(0,7);if(!months[m])months[m]={count:0,income:0,hours:0};months[m].count++;months[m].income+=x.income;months[m].hours+=Number(x.hours)||0});$('screen').innerHTML=`<div class="header glass"><h1>${T('finance')}</h1></div><div class="stats"><div class="stat glass"><small>${T('shifts')}</small><b>${a.length}</b></div><div class="stat glass"><small>${T('income')}</small><b>${money(a.reduce((s,x)=>s+x.income,0))}</b></div><div class="stat glass"><small>${T('hours')}</small><b>${a.reduce((s,x)=>s+x.hours,0)}</b></div></div><div class="section glass"><h2>${T('reports')}</h2><div class="month-report">${Object.keys(months).sort().reverse().map(m=>`<div>${m}</div><div><b>${months[m].count}</b> · ${money(months[m].income)} · ${months[m].hours} ч</div>`).join('')||`<div>${T('empty')}</div>`}</div></div>`}
function settings(){$('screen').innerHTML=`<div class="header glass"><h1>${T('settings')}</h1></div><div class="section glass"><h2>${T('language')}</h2><div class="flag-row"><button class="flag ${lang==='ru'?'active':''}" onclick="setLang('ru')">🇷🇺</button><button class="flag ${lang==='en'?'active':''}" onclick="setLang('en')">🇺🇸</button></div></div><div class="section glass"><h2>${T('appearance')}</h2><label>${T('theme')}</label><select onchange="setTheme(this.value)"><option value="system" ${theme==='system'?'selected':''}>${T('system')}</option><option value="light" ${theme==='light'?'selected':''}>☀️ Light</option><option value="dark" ${theme==='dark'?'selected':''}>🌙 Dark</option></select></div><div class="section glass"><h2>${T('addWork')}</h2>${works.map((w,i)=>`<div class="row"><span class="work-card"><i class="swatch" style="background:${w.color}"></i>${esc(w.name)}</span><button class="btn" onclick="removeWork(${i})">×</button></div>`).join('')}<label>${T('name')}</label><input id="newWork" placeholder="${T('name')}"><label>${T('color')}</label><input class="color" id="newColor" type="color" value="#72dfff"><div class="actions"><button class="btn primary" onclick="addWork()">＋ ${T('add')}</button></div></div><div class="section glass"><button class="btn primary" onclick="showAgreement()">${T('agreement')}</button></div>`}
function addWork(){let name=$('newWork').value.trim(),color=$('newColor').value;if(!name)return;if(!works.some(w=>w.name===name)){works.push({name,color});persist();render()}}function removeWork(i){works.splice(i,1);persist();render()}function showAgreement(){$('agreementTitle').textContent=T('agreement');$('agreementText').textContent=lang==='ru'?'ShiftFlow — локальный планировщик смен. Данные хранятся только в браузере этого устройства.':'ShiftFlow is a local shift planner. Data is stored only in this browser.';$('agreementModal').classList.add('show')}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')applyTheme()});applyTheme();render();
</script></body></html>
