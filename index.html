<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1320"><title>ShiftFlow</title>
<style>
:root{--bg:#0d1320;--card:rgba(255,255,255,.1);--line:rgba(255,255,255,.16);--text:#f5f7ff;--muted:#aeb8cb;--accent:#7c9cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#26345d 0,transparent 38%),linear-gradient(135deg,#0d1320,#171d2d);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;color:var(--text)}.app{max-width:760px;margin:auto;padding:20px 16px 105px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 0 18px}.brand{font-size:28px;font-weight:800}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px}.glass{background:var(--card);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(20px);box-shadow:0 12px 40px #0002}.header{padding:18px;display:flex;justify-content:space-between;align-items:center}.header h1{font-size:21px;margin:0;text-transform:capitalize}.btn{background:#ffffff18;border:1px solid var(--line);padding:10px 14px;border-radius:14px}.primary{background:linear-gradient(135deg,#7c9cff,#70d6ff);color:#071020;font-weight:700}.calendar{margin-top:14px;padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:62px;border-radius:15px;padding:8px;background:#ffffff08;color:var(--text);text-align:left;border:1px solid transparent;position:relative}.day:hover{border-color:#ffffff66}.day.muted{opacity:.3}.day.today{outline:2px solid var(--accent)}.dot{position:absolute;left:7px;right:7px;bottom:6px;height:5px;border-radius:10px;background:var(--accent)}.empty{visibility:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:17px 12px}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:21px;margin-top:7px}.section{padding:18px;margin-top:14px}.section h2{font-size:18px;margin:0 0 14px}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #ffffff12}.row:last-child{border:0}.pill{padding:6px 10px;border-radius:10px;background:#ffffff12;color:var(--muted);font-size:12px}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(728px,calc(100% - 32px));padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;z-index:5}.nav button{background:transparent;padding:11px 5px;border-radius:16px;color:var(--muted)}.nav button.active{background:#7c9cff35;color:#fff}.nav span{display:block;font-size:11px;margin-top:3px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{width:min(760px,100%);margin:auto;padding:22px;border-radius:28px 28px 0 0;background:#182033;border:1px solid var(--line)}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,select{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#ffffff0d;color:var(--text);outline:none}option{background:#182033}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}.light{--bg:#eef2ff;--card:#ffffffaa;--line:#b7c2df;--text:#182033;--muted:#59657d}body.light{background:linear-gradient(135deg,#e8edff,#fff);color:var(--text)}@media(max-width:500px){.stats{gap:6px}.stat b{font-size:16px}.day{min-height:52px;padding:6px;font-size:13px}}
</style></head>
<body><main class="app"><div class="top"><div><div class="brand">Shift<span>Flow</span></div><div class="sub">Твои смены. Твой доход.</div></div><button class="btn" id="theme">☼</button></div><div id="screen"></div></main><nav class="nav glass"><button data-tab="calendar" class="active">📅<span>Календарь</span></button><button data-tab="finance">💰<span>Финансы</span></button><button data-tab="settings">⚙️<span>Настройки</span></button></nav><div class="modal" id="modal"><div class="sheet"><h2 id="modalTitle">Добавить смену</h2><label>Место работы</label><select id="place"><option value="Склад">Склад · 650 ₽/ч</option><option value="Кофейня">Кофейня · 520 ₽/ч</option><option value="Доставка">Доставка · 780 ₽/ч</option></select><label>Часы</label><input id="hours" type="number" min="0.5" step="0.5" value="8"><div class="row"><span>Доход</span><b id="income">5 200 ₽</b></div><div class="actions"><button class="btn" id="close">Отмена</button><button class="btn primary" id="save">Сохранить</button></div></div></div>
<script>
const rates={Склад:650,Кофейня:520,Доставка:780}, colors={Склад:'#61d4ff',Кофейня:'#6ee7a7',Доставка:'#ffb86c'};let tab='calendar',selected=new Date(),data=JSON.parse(localStorage.shiftflow||'{}');
function key(d){return d.toISOString().slice(0,10)} function money(n){return new Intl.NumberFormat('ru-RU').format(Math.round(n))+' ₽'} function saveData(){localStorage.shiftflow=JSON.stringify(data)}
function render(){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));let s=document.querySelector('#screen');if(tab==='calendar')calendar(s);if(tab==='finance')finance(s);if(tab==='settings')settings(s)}
function calendar(s){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;let cells='';for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=key(dt),shift=data[k],today=key(dt)===key(new Date());cells+=`<button class="day ${today?'today':''}" onclick="openModal('${k}')">${d}${shift?`<i class="dot" style="background:${colors[shift.place]||'#7c9cff'}"></i>`:''}</button>`}let total=Object.values(data).filter(x=>new Date(x.date||'').getMonth()===m&&new Date(x.date||'').getFullYear()===y);s.innerHTML=`<div class="header glass"><button class="btn" onclick="move(-1)">‹</button><h1>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h1><button class="btn" onclick="move(1)">›</button></div><div class="calendar glass"><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div></div><div class="stats"><div class="stat glass"><small>Смен</small><b>${total.length}</b></div><div class="stat glass"><small>Часов</small><b>${total.reduce((a,x)=>a+x.hours,0)}</b></div><div class="stat glass"><small>Доход</small><b>${money(total.reduce((a,x)=>a+x.hours*rates[x.place],0))}</b></div></div>`}
function move(n){selected=new Date(selected.getFullYear(),selected.getMonth()+n,1);render()} function openModal(k){selected= new Date(k+'T12:00:00');document.querySelector('#modal').classList.add('show');let old=data[k];document.querySelector('#place').value=old?.place||'Склад';document.querySelector('#hours').value=old?.hours||8;updateIncome()}function updateIncome(){let p=document.querySelector('#place').value,h=+document.querySelector('#hours').value||0;document.querySelector('#income').textContent=money(rates[p]*h)}
function finance(s){let all=Object.values(data),hours=all.reduce((a,x)=>a+x.hours,0),income=all.reduce((a,x)=>a+x.hours*rates[x.place],0);s.innerHTML=`<div class="header glass"><h1>Финансы</h1><button class="btn primary" onclick="openModal('${key(new Date())}')">＋ Смена</button></div><div class="stats"><div class="stat glass"><small>Всего смен</small><b>${all.length}</b></div><div class="stat glass"><small>Всего часов</small><b>${hours}</b></div><div class="stat glass"><small>Заработано</small><b>${money(income)}</b></div></div><div class="section glass"><h2>Места работы</h2>${Object.keys(rates).map(p=>{let v=all.filter(x=>x.place===p).reduce((a,x)=>a+x.hours*rates[p],0);return `<div class="row"><span><b style="color:${colors[p]}">●</b> ${p}<small class="sub"> · ${rates[p]} ₽/ч</small></span><b>${money(v)}</b></div>`}).join('')}</div><div class="section glass"><h2>Последние смены</h2>${all.slice(-5).reverse().map(x=>`<div class="row"><span>${x.date} · ${x.place}</span><span class="pill">${x.hours} ч · ${money(x.hours*rates[x.place])}</span></div>`).join('')||'<div class="sub">Пока нет смен</div>'}</div>`}
function settings(s){s.innerHTML=`<div class="header glass"><h1>Настройки</h1></div><div class="section glass"><h2>Внешний вид</h2><div class="row"><span>Тёмная тема</span><button class="btn" onclick="document.body.classList.toggle('light')">Переключить</button></div></div><div class="section glass"><h2>Данные</h2><div class="row"><span>Смен сохранено</span><b>${Object.keys(data).length}</b></div><div class="actions"><button class="btn" onclick="localStorage.removeItem('shiftflow');data={};render()">Очистить данные</button></div></div><div class="section glass"><h2>О ShiftFlow</h2><p class="sub">Офлайн-планировщик смен и дохода. Данные сохраняются в браузере на этом устройстве.</p></div>`}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelector('#theme').onclick=()=>document.body.classList.toggle('light');document.querySelector('#close').onclick=()=>document.querySelector('#modal').classList.remove('show');document.querySelector('#place').onchange=updateIncome;document.querySelector('#hours').oninput=updateIncome;document.querySelector('#save').onclick=()=>{let k=key(selected),place=document.querySelector('#place').value,hours=+document.querySelector('#hours').value;if(hours>0)data[k]={date:k,place,hours};saveData();document.querySelector('#modal').classList.remove('show');render()};render();
</script></body></html>
