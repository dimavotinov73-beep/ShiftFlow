<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf3ff"><title>ShiftFlow</title>
<style>
:root{--bg:#edf3ff;--bg2:#f9fbff;--text:#17233c;--muted:#636f84;--glass:rgba(255,255,255,.42);--glass-strong:rgba(255,255,255,.66);--line:rgba(255,255,255,.7);--accent:#5d7cff;--accent-2:#67d5ff;--shadow:0 20px 55px rgba(97,112,161,.18)}
body.dark{--bg:#0b1224;--bg2:#15233d;--text:#f8fbff;--muted:#a9b4c8;--glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.15);--line:rgba(255,255,255,.18);--shadow:0 22px 60px rgba(0,0,0,.3)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--text)}body{background:radial-gradient(circle at 10% 0,#dfeaff,transparent 32%),radial-gradient(circle at 100% 80%,#cdfafd,transparent 25%),linear-gradient(140deg,var(--bg),var(--bg2));background-attachment:fixed;transition:background .35s ease,color .35s ease}button,input,select{font:inherit}button{color:var(--text);cursor:pointer;border:0}.app{max-width:760px;margin:auto;padding:18px 16px 110px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{font-size:30px;font-weight:800;letter-spacing:-1px}.brand span{color:#59caef}.sub{font-size:12px;color:var(--muted)}.glass{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.06)),var(--glass);border:1px solid var(--line);border-radius:28px;box-shadow:inset 0 1px rgba(255,255,255,.6),var(--shadow);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);animation:appear .25s ease}.glass:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.32),transparent 32%);pointer-events:none}.glass>*{position:relative}.btn{background:rgba(255,255,255,.16);border:1px solid var(--line);border-radius:14px;padding:9px 13px;transition:.18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 18px rgba(96,123,250,.18)}.primary{background:linear-gradient(135deg,#6a8bff,#69d1f2);color:#081a2f;font-weight:700}.header{display:flex;align-items:center;justify-content:space-between;padding:16px;margin-bottom:14px}.header h1{margin:0;font-size:22px;text-transform:capitalize}.calendar{padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;color:var(--muted);font-size:12px;padding:8px 0}.day{min-height:78px;padding:7px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid transparent;transition:.18s ease;cursor:pointer}.day:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.65)}.day.today{outline:2px solid #55d4ee;background:rgba(109,219,255,.11);box-shadow:0 0 0 4px rgba(109,219,255,.10)}.day.empty{visibility:hidden}.day-head{font-weight:700;padding-left:1px}.day-list{margin-top:6px;display:flex;flex-direction:column;gap:5px}.day-item{display:flex;align-items:center;gap:6px;min-height:18px;font-size:10px;line-height:1.1;color:var(--text);opacity:.95}.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}.mini-delete{margin-left:auto;width:16px;height:16px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-size:11px;line-height:14px;padding:0;display:flex;align-items:center;justify-content:center}.mini-delete:hover{background:rgba(255,130,130,.12)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;justify-items:center}.stat{padding:18px 16px;text-align:center;width:100%}.stat small{display:block;color:var(--muted);font-size:12px}.stat b{display:block;font-size:20px;margin-top:7px}.section{padding:17px;margin-top:14px}.section h2{margin:0 0 12px;font-size:17px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.14)}.row:last-child{border-bottom:0}.nav{position:fixed;z-index:4;bottom:16px;left:50%;transform:translateX(-50%);width:min(728px,calc(100% - 32px));padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{background:transparent;border-radius:17px;padding:10px;color:var(--muted);transition:.18s ease}.nav button.active{background:rgba(116,146,255,.18);color:var(--text);box-shadow:inset 0 1px rgba(255,255,255,.6),0 10px 20px rgba(71,96,147,.12)}.nav span{display:block;font-size:11px;margin-top:3px}.modal{position:fixed;z-index:10;inset:0;background:rgba(5,11,22,.64);display:none;align-items:flex-end;animation:fade .18s ease}.modal.show{display:flex}@keyframes fade{from{opacity:0}to{opacity:1}}.sheet{width:min(760px,100%);margin:auto;padding:22px;background:var(--bg2);border:1px solid var(--line);border-radius:28px 28px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.18);animation:sheet .22s ease}@keyframes sheet{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:none}}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.input, select{width:100%;padding:12px;border-radius:13px;border:1px solid var(--line);background:var(--glass);color:var(--text);outline:0}.actions{display:flex;gap:9px;margin-top:18px}.actions>*{flex:1}.flag-row{display:flex;gap:10px;align-items:center}.flag-button{width:54px;height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--glass);border:1px solid var(--line);transition:.18s}.flag-button.active{outline:2px solid var(--accent);background:var(--glass-strong);box-shadow:0 10px 18px rgba(92,110,250,.12)}.theme-row{display:flex;gap:8px;flex-wrap:wrap}.theme-btn{padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass);min-width:84px}.theme-btn.active{background:rgba(93,124,255,.18);outline:2px solid rgba(93,124,255,.28)}.day-list-panel{display:flex;flex-direction:column;gap:8px;margin-top:10px;margin-bottom:12px}.day-entry{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line)}.day-entry .meta{flex:1;display:flex;align-items:center;gap:8px;font-size:12px}.sheet h2{text-align:center}.agreement{color:var(--muted);line-height:1.6;text-align:center;padding:8px 0}.month-report{display:grid;grid-template-columns:1fr auto;gap:12px 14px}.month-report .item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.14)}.month-report .item:nth-last-child(-n+2){border-bottom:0}.centered{justify-items:center !important}.small-compact{padding:8px 10px;border-radius:12px;font-size:12px}.@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}.day{min-height:66px}.stat b{font-size:17px}} 
</style></head>
<body>
<main class="app">
<div class="top"><div><div class="brand">Shift<span>Flow</span></div><div class="sub" id="subtitle">Твои смены. Твой доход.</div></div></div>
<div id="screen"></div>
</main>
<nav class="nav glass">
<button data-tab="calendar" class="active">📅<span id="nav-home">Главная</span></button>
<button data-tab="finance">💰<span id="nav-finance">Финансы</span></button>
<button data-tab="settings">⚙️<span id="nav-settings">Настройки</span></button>
</nav>
<div class="modal" id="shiftModal"><div class="sheet"><h2 id="shiftTitle">Смены</h2><div id="dayList" class="day-list-panel"></div><label id="workLabel">Наименование работы</label><input class="input" id="workInput" placeholder="Например: Официант"><label id="colorLabel">Цвет</label><input class="input" id="colorInput" type="color" value="#72dfff"><label id="incomeLabel">Доход, ₽</label><input class="input" id="incomeInput" type="number" min="0" step="1" placeholder="5000"><label id="hoursLabel">Часы</label><input class="input" id="hoursInput" type="number" min="0" step="0.5" placeholder="8"><div class="actions"><button class="btn" id="cancelShift">Отмена</button><button class="btn primary" id="saveShift">Сохранить</button></div></div></div>
<div class="modal" id="agreeModal"><div class="sheet"><h2 id="agreementTitle">Пользовательское соглашение</h2><p id="agreementText" class="agreement"></p><div class="actions"><button class="btn primary" onclick="closeModal('agreeModal')">OK</button></div></div></div>
<script>
const langData={ru:{subtitle:'Твои смены. Твой доход.',home:'Главная',finance:'Финансы',settings:'Настройки',shifts:'Смены',income:'Доход',hours:'Часы',make:'Добавить',cancel:'Отмена',save:'Сохранить',report:'Отчёт по месяцам',language:'Язык',appearance:'Внешний вид',theme:'Тема',system:'Как в системе',empty:'Нет данных',agreement:'Пользовательское соглашение',work:'Работа',color:'Цвет',today:'Сегодня',months:'Месяц'},en:{subtitle:'Your shifts. Your income.',home:'Home',finance:'Finance',settings:'Settings',shifts:'Shifts',income:'Income',hours:'Hours',make:'Add',cancel:'Cancel',save:'Save',report:'Monthly report',language:'Language',appearance:'Appearance',theme:'Theme',system:'System',empty:'No data',agreement:'User Agreement',work:'Work',color:'Color',today:'Today',months:'Month'}};
let lang=localStorage.sfLang||'ru',theme=localStorage.sfTheme||'system',tab='calendar',selected=new Date(),editingDate=null;let shifts=JSON.parse(localStorage.sfShifts||'{}');
function T(key){return langData[lang][key]||key}function $(id){return document.getElementById(id)}function localDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function money(n){return new Intl.NumberFormat(lang==='ru'?'ru-RU':'en-US').format(Math.round(n||0))+' ₽'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function persist(){localStorage.sfShifts=JSON.stringify(shifts)}
function applyTheme(){const isDark=theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',isDark)}
function render(){applyTheme();$('subtitle').textContent=T('subtitle');$('nav-home').textContent=T('home');$('nav-finance').textContent=T('finance');$('nav-settings').textContent=T('settings');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));tab==='calendar'?calendar():tab==='finance'?finance():settings()}
function moveMonth(step){selected=new Date(selected.getFullYear(), selected.getMonth()+step,1);render()}
function openShift(dateKey){editingDate=dateKey;const items=shifts[dateKey]||[];$('dayList').innerHTML=items.length?items.map((item,i)=>`<div class="day-entry"><span class="dot" style="background:${item.color||'#72dfff'}"></span><div class="meta"><b>${esc(item.work)}</b><span>${money(item.income)} · ${item.hours||0} ч</span></div><button class="mini-delete" onclick="removeShift('${dateKey}',${i});event.stopPropagation();">×</button></div>`).join(''):'<div class="agreement">'+T('empty')+'</div>';$('shiftTitle').textContent=T('shifts');$('workLabel').textContent=T('work');$('colorLabel').textContent=T('color');$('incomeLabel').textContent=T('income')+', ₽';$('hoursLabel').textContent=T('hours');$('cancelShift').textContent=T('cancel');$('saveShift').textContent=T('save');$('workInput').value='';$('colorInput').value='#72dfff';$('incomeInput').value='';$('hoursInput').value='';$('shiftModal').classList.add('show')}
function closeModal(id){$(id).classList.remove('show')}
function removeShift(dateKey,index){let arr=shifts[dateKey]||[];arr.splice(index,1);if(arr.length){shifts[dateKey]=arr}else delete shifts[dateKey];persist();render();if($("shiftModal").classList.contains('show')) openShift(dateKey)}
$('saveShift').onclick=()=>{if(!editingDate)return;let work=$('workInput').value.trim(),income=Number($('incomeInput').value),hours=Number($('hoursInput').value),color=$('colorInput').value;if(!work||income<0||hours<0)return alert(lang==='ru'?'Заполните все поля':'Fill in all fields');let item={date:editingDate,work,income,hours,color};if(!shifts[editingDate]) shifts[editingDate]=[];shifts[editingDate].push(item);persist();closeModal('shiftModal');render()};$('cancelShift').onclick=()=>closeModal('shiftModal');
function calendar(){let y=selected.getFullYear(),m=selected.getMonth(),first=new Date(y,m,1),daysInMonth=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7,today=localDateKey(new Date()),cells='';for(let i=0;i<start;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=daysInMonth;d++){let dt=new Date(y,m,d),k=localDateKey(dt),items=shifts[k]||[];cells+=`<div class="day ${k===today?'today':''}" onclick="openShift('${k}')"><div class="day-head">${d}</div><div class="day-list">${items.slice(0,2).map(item=>`<div class="day-item"><span class="dot" style="background:${item.color||'#72dfff'}"></span><span>${esc(item.work)} · ${money(item.income)}</span></div>`).join('')}${items.length>2?`<div class="day-item"><span class="dot" style="background:#5c77ff"></span><span>+${items.length-2}</span></div>`:''}</div></div>`}let monthItems=Object.values(shifts).flat().filter(x=>x.date&&x.date.startsWith(`${y}-${String(m+1).padStart(2,'0')}`));$('screen').innerHTML=`<div class="header glass"><button class="btn" onclick="moveMonth(-1)">‹</button><h1>${first.toLocaleDateString(lang==='ru'?'ru-RU':'en-US',{month:'long',year:'numeric'})}</h1><button class="btn" onclick="moveMonth(1)">›</button></div><div class="calendar glass"><div class="week">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div>${x}</div>`).join('')}</div><div class="days">${cells}</div></div><div class="stats centered"><div class="stat glass"><small>${T('shifts')}</small><b>${monthItems.length}</b></div><div class="stat glass"><small>${T('income')}</small><b>${money(monthItems.reduce((s,x)=>s+x.income,0))}</b></div></div>`}
function finance(){let arr=Object.values(shifts).flat();let totalIncome=arr.reduce((s,x)=>s+x.income,0);let totalHours=arr.reduce((s,x)=>s+(Number(x.hours)||0),0);let byMonth={};arr.forEach(x=>{let m=x.date.slice(0,7);if(!byMonth[m])byMonth[m]={count:0,income:0,hours:0};byMonth[m].count++;byMonth[m].income+=x.income;byMonth[m].hours+=Number(x.hours)||0});$('screen').innerHTML=`<div class="header glass"><h1>${T('finance')}</h1></div><div class="stats centered"><div class="stat glass"><small>${T('shifts')}</small><b>${arr.length}</b></div><div class="stat glass"><small>${T('income')}</small><b>${money(totalIncome)}</b></div><div class="stat glass"><small>${T('hours')}</small><b>${totalHours}</b></div></div><div class="section glass"><h2>${T('report')}</h2><div class="month-report">${Object.keys(byMonth).sort().reverse().map(m=>`<div class="item">${m}</div><div class="item">${byMonth[m].count} · ${money(byMonth[m].income)} · ${byMonth[m].hours} ч</div>`).join('')||`<div class="item">${T('empty')}</div><div class="item">-</div>`}</div></div>`}
function settings(){$('screen').innerHTML=`<div class="header glass"><h1>${T('settings')}</h1></div><div class="section glass"><h2>${T('language')}</h2><div class="flag-row"><button class="flag-button ${lang==='ru'?'active':''}" onclick="setLang('ru')">🇷🇺</button><button class="flag-button ${lang==='en'?'active':''}" onclick="setLang('en')">🇺🇸</button></div></div><div class="section glass"><h2>${T('appearance')}</h2><div class="theme-row"><button class="theme-btn ${theme==='system'?'active':''}" onclick="setTheme('system')">◐ ${T('system')}</button><button class="theme-btn ${theme==='light'?'active':''}" onclick="setTheme('light')">☀️ Light</button><button class="theme-btn ${theme==='dark'?'active':''}" onclick="setTheme('dark')">🌙 Dark</button></div></div><div class="section glass"><button class="btn primary small-compact" onclick="showAgreement()">${T('agreement')}</button></div>`}
function setLang(v){lang=v;localStorage.sfLang=v;document.documentElement.lang=v;render()}function setTheme(v){theme=v;localStorage.sfTheme=v;document.body.classList.add('theme-change');applyTheme();setTimeout(()=>document.body.classList.remove('theme-change'),250);render()}function showAgreement(){let text=lang==='ru'?'ShiftFlow — локальный планировщик смен. Данные сохраняются только в браузере на этом устройстве и не отправляются на сервер. Используя приложение, вы соглашаетесь с условиями.':'ShiftFlow is a local shift planner. Data is stored only in this browser and is not sent to a server. By using the app, you agree to the terms.';$('agreementText').textContent=text;$('agreementTitle').textContent=T('agreement');$('agreeModal').classList.add('show')}
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')applyTheme()});document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});applyTheme();render();
</script></body></html>
