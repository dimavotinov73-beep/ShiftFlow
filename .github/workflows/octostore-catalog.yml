# Каждую ночь обновляет каталог сайта OctoStore (папка octostore/):
# собирает товары, фото и цены с biggeek.ru, ставит цены на 2% ниже и коммитит изменения.
# Расписание GitHub выполняет только для ветки по умолчанию (main).
name: Обновление каталога OctoStore

on:
  schedule:
    - cron: "17 1 * * *" # 04:17 по Москве
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: octostore-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить Pillow (для сжатия фото)
        run: pip install pillow

      - name: Собрать каталог
        run: python3 octostore/tools/update_catalog.py --details 400

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A octostore/assets
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Обновление каталога OctoStore $(date -u +%F)"
          git push
