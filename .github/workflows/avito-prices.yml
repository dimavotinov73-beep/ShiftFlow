# Каждый день обновляет цены объявлений на Авито по прайсу из Telegram-канала (папка avito/).
# Пока в Settings → Secrets and variables → Actions → Variables нет переменной AVITO_APPLY=1,
# работает в тестовом режиме: только показывает, какие цены поменял бы (отчёт — avito/data/last_run.md).
# Расписание GitHub выполняет только для ветки по умолчанию (main).
name: Цены на Авито

on:
  schedule:
    - cron: "41 6 * * *" # 09:41 по Москве
  workflow_dispatch:
    inputs:
      mode:
        description: "sync — обновить цены, match — подобрать пары для новых объявлений"
        type: choice
        options: [sync, match]
        default: sync

permissions:
  contents: write

concurrency:
  group: avito-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
      AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Подобрать пары
        if: inputs.mode == 'match'
        run: python3 avito/tools/avito_prices.py match

      - name: Обновить цены
        if: inputs.mode != 'match'
        run: python3 avito/tools/avito_prices.py sync ${{ vars.AVITO_APPLY == '1' && '--apply' || '' }}

      - name: Сохранить изменения
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A avito/data avito/mapping.csv
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Цены на Авито $(date -u +%F)"
          git pull --rebase
          git push
