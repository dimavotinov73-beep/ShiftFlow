# Сборка Android-приложения ShiftFlow: AAB для Google Play / RuStore и APK для установки вручную.
# Подпись: если в Settings → Secrets and variables → Actions заданы секреты
#   SF_KEYSTORE_BASE64   — upload-ключ (.jks), закодированный в base64
#   SF_KEYSTORE_PASSWORD — пароль хранилища
#   SF_KEY_ALIAS         — алиас ключа
#   SF_KEY_PASSWORD      — пароль ключа
# то AAB и APK будут подписаны. Без секретов собираются неподписанные версии (для проверки).
name: Android

on:
  push:
    paths:
      - "web/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Подготовить ключ подписи (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.SF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "SF_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "Секреты подписи не заданы — соберу неподписанный релиз."
          fi

      - name: Собрать
        working-directory: android
        env:
          SF_KEYSTORE_PASSWORD: ${{ secrets.SF_KEYSTORE_PASSWORD }}
          SF_KEY_ALIAS: ${{ secrets.SF_KEY_ALIAS }}
          SF_KEY_PASSWORD: ${{ secrets.SF_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease assembleRelease lintRelease

      - uses: actions/upload-artifact@v4
        with:
          name: shiftflow-android
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
